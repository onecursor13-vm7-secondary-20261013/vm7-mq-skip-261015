name: VM7 Gate4 Recorded Canary Same-SHA 261016

on:
  push:
    branches:
      - vm7-gate4-a-261016
      - vm7-gate4-b-261016
      - vm7-check-env-sensitive-261016

permissions:
  contents: read

jobs:
  capture-recorded-canary-hash:
    runs-on: ubuntu-latest
    environment: vm7-protected-env-261016
    steps:
      - name: Hash Owner-recorded protected canary
        shell: bash
        env:
          CANARY: ${{ secrets.VM7_GATE4_PROTECTED_SECRET_261016 }}
        run: |
          set -euo pipefail
          test -n "$CANARY"
          printf '%s' "$CANARY" | sha256sum | cut -d' ' -f1 > gate4-secret-sha256.txt
      - name: Upload only the digest
        uses: actions/upload-artifact@v4
        with:
          name: vm7-gate4-secret-hash-261016
          path: gate4-secret-sha256.txt
          if-no-files-found: error
