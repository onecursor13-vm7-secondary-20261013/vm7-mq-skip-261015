name: VM7 Checkrun Protected Environment Secret 261016

on:
  push:
    branches:
      - vm7-check-env-a-head-261016
      - vm7-check-env-b-head-261016
      - vm7-check-env-sensitive-261016

permissions:
  contents: read

jobs:
  capture-protected-environment-canary:
    runs-on: ubuntu-latest
    environment: vm7-protected-env-261016
    steps:
      - name: Write disposable environment canary without logging it
        shell: bash
        env:
          VM7_OWNER_CANARY: ${{ secrets.VM7_PROTECTED_ENV_SECRET_261016 }}
        run: |
          test -n "$VM7_OWNER_CANARY"
          printf '%s' "$VM7_OWNER_CANARY" > vm7-protected-env-canary-261016.txt
      - name: Upload disposable environment canary
        uses: actions/upload-artifact@v4
        with:
          name: vm7-protected-env-canary-261016
          path: vm7-protected-env-canary-261016.txt
          retention-days: 1
