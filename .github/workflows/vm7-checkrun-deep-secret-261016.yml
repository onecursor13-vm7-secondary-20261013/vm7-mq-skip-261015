name: VM7 Checkrun Deep Secret 261016

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  capture-owner-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Write disposable canary without logging it
        shell: bash
        env:
          VM7_OWNER_CANARY: ${{ secrets.VM7_CHECKRUN_DEEP_SECRET_261016 }}
        run: |
          test -n "$VM7_OWNER_CANARY"
          printf '%s' "$VM7_OWNER_CANARY" > vm7-checkrun-deep-canary-261016.txt
      - name: Upload disposable canary
        uses: actions/upload-artifact@v4
        with:
          name: vm7-checkrun-deep-canary-261016
          path: vm7-checkrun-deep-canary-261016.txt
          retention-days: 1
