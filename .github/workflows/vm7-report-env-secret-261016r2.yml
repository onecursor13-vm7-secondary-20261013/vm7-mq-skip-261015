name: VM7 Fresh Same-SHA Protected Environment 261016R2

on:
  push:
    branches:
      - vm7-report-a-head-261016r2
      - vm7-report-b-head-261016r2
      - vm7-check-env-sensitive-261016

permissions:
  contents: read

jobs:
  capture-protected-environment-canary:
    runs-on: ubuntu-latest
    environment: vm7-protected-env-261016
    steps:
      - name: Hash disposable environment canary without logging it
        shell: bash
        env:
          VM7_OWNER_CANARY: ${{ secrets.VM7_PROTECTED_ENV_SECRET_261016 }}
        run: |
          test -n "$VM7_OWNER_CANARY"
          printf '%s' "$VM7_OWNER_CANARY" | sha256sum | cut -d' ' -f1 > vm7-protected-env-canary-sha256-261016r2.txt
      - name: Upload only the canary digest
        uses: actions/upload-artifact@v4
        with:
          name: vm7-protected-env-canary-sha256-261016r2
          path: vm7-protected-env-canary-sha256-261016r2.txt
          retention-days: 1
