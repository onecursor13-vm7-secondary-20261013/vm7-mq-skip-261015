# Attacker normal-path configuration change control; must require owner approval.
merge_protections_settings:
  reporting_method: deployments
  post_comment: true

merge_protections:
  - name: Require Secondary Owner approval on governed configuration branch
    if:
      - base = main
    success_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013
  - name: Require Secondary Owner approval on governed allowed ref
    if:
      - base = vm7-deploy-governed-allow-261016
    success_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013
  - name: Require Secondary Owner approval on governed sensitive ref
    if:
      - base = vm7-deploy-governed-sensitive-261016
    success_conditions:
      - approved-reviews-by = onecursor13-vm7-secondary-20261013
